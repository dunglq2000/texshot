[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "texshot"
dynamic = ["version"]
description = "Build standalone TeX figures (TikZ, MusiXTeX, ...) into SVG, PDF or JPEG for rST/Sphinx."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lê Quốc Dũng", email = "dunglq@yandex.ru" }]
keywords = ["latex", "tikz", "svg", "dvisvgm", "sphinx", "restructuredtext", "figures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.optional-dependencies]
jpeg = ["pdf2image"]

[project.scripts]
texshot = "texshot.cli:main"

[tool.hatch.version]
path = "src/texshot/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/texshot", "examples/*.json", "examples/**/*.tex", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/texshot"]
